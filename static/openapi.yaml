openapi: 3.1.0
info:
  title: Kakitu developer API
  version: 0.4.0
  summary: Register a business, move KSHS, and collect and pay out by M-Pesa.
  license:
    name: MIT
    identifier: MIT
  description: |
    Kakitu is a Kenyan shilling stablecoin (KSHS). The developer API lets a business register
    its own wallet address, send KSHS with Kakitu paying the gas, read prices, balances and
    orders, collect an M-Pesa payment credited in KSHS **at its own wallet address**, and pay out
    to M-Pesa. Kakitu is non-custodial: it never holds the merchant's
    money and never holds the merchant's key.

    ## What is open today

    **M-Pesa collections and payouts are switched on for the platform** (since 30 October 2026).
    Collections work for an **approved** merchant, within its caps. Payouts also need the
    merchant's own payout switch, which is off until an operator turns it on; until then the
    payout routes answer `403 payouts_disabled`. Either platform switch can be turned off by an
    operator without a release: collections then answer `503 rail_unavailable` before anything
    is written. A business can also be paid with no registration at all, by a plain KSHS
    transfer to its address — the Kakitu extension's `pay()`, a `kakitu:` link or a QR code. An approved merchant is told of it by a signed
    `transfer.received` webhook, which carries the payer's `reference`; **a reference is the
    payer's claim, not proof**, so the merchant still checks the amount and the recipient. See
    https://developer.kakitu.org/docs/intro.

    ## Access

    The developer API is in private release. Registration is open to anyone. Only the routes
    that move money check approval: `POST /v1/charges` and `POST /v1/transfers` refuse a
    merchant that is not `approved`, and so do the payout routes (`POST /v1/payouts/requests`,
    `POST /v1/payouts/quote`, `POST /v1/payouts`, `POST /v1/payout-destinations`). Every other
    route needs a signed request and nothing more.

    **Payouts are off by default for each merchant.** They are governed by two switches that
    are ANDed: a global one for the whole platform (on today), and a per-merchant one on your
    own record (off until an operator turns it on). Both are an
    operator's decision and neither can be turned on through this API. Until both are on, the
    two routes that price and send a payout answer an approved merchant with
    `403 payouts_disabled` — and which of the two is off is deliberately not revealed. A
    merchant that is not approved gets `403 merchant_not_approved` first. The two read routes,
    `GET /v1/payouts` and `GET /v1/payouts/{id}`, never answer `payouts_disabled`. Collecting
    is a separate permission from paying out, with its own caps and its own counter; being
    approved to collect does not enable payouts.

    ## Trying requests from this page

    The "Try it" console on the API reference **cannot sign requests**: every route except
    `GET /config` needs an EIP-191 signature made with your wallet key, which a browser form
    has no way to produce. Sent from here, they answer `401`. Use the signers on
    https://developer.kakitu.org/docs/authentication or an SDK.

    The request and response shapes in this document are final.

    ## Authentication — your wallet address is the credential

    **There are no API keys.** There is no secret to issue, rotate or leak: the merchant's wallet
    address *is* the credential, and possession of its key is the proof. Every request carries
    three headers:

    | Header | Value |
    | --- | --- |
    | `X-Kakitu-Address` | the claimed signer, EIP-55 or lowercase hex (compared case-insensitively) |
    | `X-Kakitu-Timestamp` | unix seconds |
    | `X-Kakitu-Signature` | `0x` + 65 bytes, an EIP-191 `personal_sign` signature (v = 27/28 or 0/1) |

    The signed message is exactly this string:

    ```
    {METHOD} {path}{?query} {timestamp} {sha256hex(body)}
    ```

    - `{METHOD}` is upper-case.
    - `{path}` is the URL path as the server decodes it (an escaped `%20` in a path segment
      is signed as a space). The raw query string is appended, prefixed with `?`,
      **byte-for-byte as sent**, and only when it is non-empty.
    - `{timestamp}` is the same value as the `X-Kakitu-Timestamp` header.
    - `{sha256hex(body)}` is lowercase hex SHA-256 over the **raw** request body. For a request
      with no body (every `GET` here) it is the SHA-256 of zero bytes,
      `e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855`.

    Example message: `POST /v1/charges 1761436800 e3b0c442...b855`

    ### Two different windows — do not confuse them

    - **Clock skew tolerance: 120 seconds.** `X-Kakitu-Timestamp` must be within ±120 s of
      server time, or the request is rejected (`timestamp_out_of_range`).
    - **Replay window: 300 seconds.** The first request for a given
      (address, method, path+query, timestamp, body hash) wins; any later request with the same
      five values inside 300 s is rejected (`replay`). The signature bytes are deliberately not
      part of that key, because ECDSA signatures are malleable.

    A consequence worth knowing: two byte-identical requests from the same wallet to the same
    path in the same second are a replay by design. Vary anything — the body, the query, the
    second — and they are distinct.

    ### Authentication failures use a different envelope

    A failure in the signature middleware answers `401` with `{"error": "...", "reason": "..."}`,
    **not** the `ErrorEnvelope` used everywhere else. Handle both shapes on `401`.

    ## Errors

    Every error raised by the API itself uses one envelope:

    ```json
    {"error": {"code": "invalid_request", "message": "...", "request_id": "..."}}
    ```

    `code` is the contract: a closed set, one fixed HTTP status per code. Branch on it.
    `message` is for a human developer and may be reworded at any time — never branch on it.
    `request_id` is always present and is the only handle support has; it is also returned on
    every response in the `X-Request-Id` header.

    An `internal` error always answers one fixed sentence and never reveals the underlying cause.

    ## Idempotency

    Four of the ten `POST` routes require an `Idempotency-Key` header; six do not.

    | Route | `Idempotency-Key` |
    | --- | --- |
    | `POST /v1/charges` | **required** |
    | `POST /v1/transfers` | **required** |
    | `POST /v1/payouts` | **required** |
    | `POST /v1/payouts/requests` | **required** |
    | `POST /v1/merchants` | **not required** (registration is an upsert) |
    | `POST /v1/quotes` | **not required** (a quote creates no order, charge or transfer) |
    | `POST /v1/payouts/quote` | **not required** (a payout quote creates no payout and moves no money) |
    | `POST /v1/events/{id}/replay` | **not required** (idempotent by construction) |
    | `POST /v1/payout-destinations` | **not required** (saving a place twice returns the first row) |
    | `POST /v1/payout-destinations/lock` | **not required** (a lock already where it was asked to be changes nothing) |

    Where it is required and missing, the request fails `400 idempotency_key_required`. The key
    is at most 255 characters, is scoped to the authenticated address, and is fingerprinted
    together with the method, path, raw query and body — so the same key reused on a different
    endpoint or with a different body is a `409`, never a silent replay of the first response.

    - Repeat with the **same** key and the **same** body: the stored response is replayed
      verbatim, with the header `Idempotent-Replayed: true`. Only 2xx responses are stored, so a
      failure stays retryable.
    - Repeat with the same key and a **different** body: `409 idempotency_key_reuse`.
    - Repeat while the first is still running: `409 idempotency_key_in_progress`.
    - `409 idempotency_key_acted`: the original request **acted** but its outcome was not
      recorded. Do **not** retry it, with this key or a new one. Check whether it took effect
      first.
    - `503 idempotency_unavailable`: the store could not be reached. Nothing ran. Retry shortly
      with the same key.

    A body larger than 1 MiB on a route behind this middleware is `413 request_too_large`
    (individual handlers impose smaller limits of their own — see each route;
    `POST /v1/transfers` answers an over-size body with `400 invalid_request`).

    ## Rate limiting

    There are three limiters, and a request meets them in this order.

    **1. Per caller IP, on every route.** Before the signature is checked, the platform counts
    requests per IP address (100 a minute by default; configuration). Every response carries
    its headers:

    - `X-RateLimit-Limit` — requests allowed per minute from this IP.
    - `X-RateLimit-Remaining` — how many are left.
    - `X-RateLimit-Reset` — unix time, in seconds, when the window resets.

    Over it answers `429` with `Retry-After: 60` and the **older body shape**, not the
    envelope: `{"error": "too_many_requests"}`. Many integrations behind one egress IP share
    this allowance.

    **2. Per authenticated address, on every `/v1` route.** Responses from the `/v1` chain
    carry:

    - `RateLimit-Limit` — requests allowed in the current one-minute window.
    - `RateLimit-Remaining` — how many are left, never below 0.
    - `RateLimit-Reset` — seconds until the window rolls over.

    Over the limit answers `429 rate_limited` and adds `Retry-After` (same value as
    `RateLimit-Reset`). It fails open: if its backing store is down you are not throttled, and
    reads keep working.

    **3. `POST /v1/quotes`: 30 a minute per address.** A second, process-local limit that holds
    even when the shared store is down, because every quote is a live partner call. Over it
    answers `429 rate_limited` with `Retry-After` (seconds left in the minute). It is not
    reflected in the `RateLimit-*` headers.

    `Retry-After` is guaranteed on those three 429s only. The money caps —
    `daily_cap_exceeded`, `payer_velocity_exceeded`, `payout_daily_cap_exceeded`, and the
    `rate_limited` answers from the charges-per-minute cap, the payer prompt limit and the
    hourly transfer cap — may come without it.

    ## Resources belonging to someone else

    A charge, order, payout, payout quote or webhook event that belongs to **another merchant**
    answers exactly as one that **does not exist** — same status, same code, same sentence. A
    malformed id answers the same way too. The API is never an oracle for whether another
    caller's id is real. There is no error you can use to tell the three apart.
servers:
  - url: https://walletapi.kakitu.org
    description: Production.
security:
  - walletSignature: []
tags:
  - name: Merchants
    description: Register the signing wallet as a business and read its record.
  - name: Public
    description: Unauthenticated platform configuration.
  - name: Charges
    description: Collect an M-Pesa payment and be credited in KSHS. Approved merchants only.
  - name: Transfers
    description: Gasless KSHS transfers signed by the caller.
  - name: Payouts
    description: Send shillings to an M-Pesa number, till, paybill or bank account. Off by default for each merchant and enabled per merchant by an operator. Above a threshold a person approves first.
  - name: Payout destinations
    description: The places you may pay, and the lock that holds you to them. The lock controls where cash-outs go; it does not stop KSHS transfers to other wallets.
  - name: Reads
    description: Balances, orders, limits and prices.
  - name: Events
    description: Webhook delivery history and replay.
paths:
  /config:
    get:
      operationId: getConfig
      tags: [Public]
      summary: Read public chain configuration, limits and prices
      description: |
        Unauthenticated: no signature, no headers. Not part of `/v1` and not under the `/v1`
        error envelope or per-address limiter; only the per-IP limiter applies. The KSHS
        contract to verify payments against, the per-transfer ceiling, the cash-out band and
        the live fee schedule are all here.
      security: []
      responses:
        '200':
          description: The configuration.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicConfig' }
        '429': { $ref: '#/components/responses/PerIPRateLimited' }
  /v1/merchants:
    post:
      operationId: registerMerchant
      tags: [Merchants]
      summary: Register or update the signing wallet as a merchant
      description: |
        Creates a `pending` merchant (`201`) or updates an existing one (`200`). The address comes
        from the signature, never from the body, so a wallet can only ever register itself.

        Registration is self-serve and instant, but it creates a **pending** merchant and nothing
        more. Approval, the webhook secret and the limits belong to a Kakitu operator; those
        fields do not exist on this request. A collection rings a stranger's handset with a real
        M-Pesa PIN prompt, which is why approval is not self-serve.

        `contact_phone` and `callback_url` are optional. **Absent or `null` leaves the stored
        value unchanged**; an explicit `""` clears it. Sending the wrong field name would
        otherwise silently wipe a webhook URL.

        The server-owned fields `state`, `webhook_secret`, `daily_cap_kes`, `per_charge_max_kes`,
        `address`, `reviewed_by` and `review_note` are accepted and **dropped**, so a client that
        round-trips a merchant object does not break. Any other unknown field is refused with
        `400 invalid_request` naming the key.

        `business_name` is frozen once the merchant is past `pending`, because it is the name an
        operator vetted. It is not sent with the M-Pesa prompt on a collection today, so a payer
        does not see it there. Submitting a different name then
        answers `409 merchant_name_frozen`
        and the message states whether anything was saved.

        Body limit 16 KiB. **No `Idempotency-Key` required.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantRequest' }
      responses:
        '200':
          description: Existing merchant updated.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '201':
          description: Registered for the first time, in state `pending`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '400':
          description: '`invalid_request` — malformed body, unknown field, or a field that failed validation.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '409':
          description: |
            `merchant_name_frozen`, or `open_loan` — this wallet has an open Kakitu loan, so it
            cannot register as a merchant until the loan is closed. Nothing was saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: '`request_too_large` — the body is larger than 16 KiB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/merchants/me:
    get:
      operationId: getMerchant
      tags: [Merchants]
      summary: Read the signing wallet's own merchant record
      description: |
        Returns the merchant registered to the authenticated address. The webhook secret is never
        in this response, and neither is anything derived from it.
      responses:
        '200':
          description: The merchant record.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '404':
          description: '`merchant_not_registered` — this wallet has not registered. POST /v1/merchants first.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/charges:
    post:
      operationId: createCharge
      tags: [Charges]
      summary: Create a collection — ring a payer's handset with an M-Pesa prompt
      description: |
        Creates a charge and asks the payment rail to send an M-Pesa PIN prompt to `phone`. The
        merchant must be **approved**; a `pending` or `rejected` merchant gets
        `403 merchant_not_approved`, a suspended one `403 merchant_suspended`.

        `reference` is yours and must be unique per merchant: a repeat answers
        `409 reference_reused`.

        The response is a DTO. It carries no payer phone number, no payer hash, no rail name, no
        provider status and no internal order id — which rail served the collection is not part
        of the contract, and the `status` vocabulary below is Kakitu's own, never the rail's.

        The server-owned fields `id`, `status`, `currency`, `created_at`, `paid_at`,
        `settled_at`, `fee_kes` and `credited_kes` are accepted and dropped; any other unknown
        field is `400 invalid_request`.

        Collections are a platform switch, on today. If an operator turns it off, this route
        answers `503 rail_unavailable` before anything is written. A wallet Kakitu has blocked
        is refused with `403 account_blocked` before the body is read.

        **The merchant is credited less than `amount`.** `amount` is what the payer is asked for;
        the KSHS minted to the merchant is what the payment partner's USDC buys at Kakitu's rate
        net of the mint spread — never more than `amount`, usually a little less. Once the charge
        is paid, `fee_kes` and `credited_kes` on the charge and its webhooks carry both numbers;
        they are `null` until then.

        The largest charge is the lower of your per-charge maximum and the collection partner's
        per-order ceiling, `deposit_max_per_order_usd` in `GET /config`.

        Body limit 16 KiB. **`Idempotency-Key` is REQUIRED.** Retrying with the same key replays
        the first response and the payer's handset rings exactly once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChargeRequest' }
      responses:
        '201':
          description: Charge created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Charge' }
        '400':
          description: |
            One of `invalid_request` (malformed body, unknown field, non-positive amount,
            non-Kenyan mobile number, missing or over-long reference),
            `idempotency_key_required`, `idempotency_key_invalid`,
            `amount_below_minimum` or `amount_above_maximum`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '403':
          description: '`merchant_not_approved`, `merchant_suspended` or `account_blocked` (nobody is prompted).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: '`merchant_not_registered`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: |
            `reference_reused`, or one of the idempotency conflicts: `idempotency_key_reuse`,
            `idempotency_key_in_progress`, `idempotency_key_acted`.

            `idempotency_key_acted` can come on the **first** attempt: the request may have
            reached the rail and the payer's handset may be ringing, and the outcome is not
            known. The message names the charge id. Do not send it again, with this key or a new
            reference; read the charge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: '`request_too_large` — the body is larger than 16 KiB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: |
            `rate_limited`, `daily_cap_exceeded` (the merchant's daily collection cap) or
            `payer_velocity_exceeded` (this payer has been prompted too often today).
            `Retry-After` is sent only with the shared per-minute limit; the charges-per-minute
            cap, the daily cap and the payer limit may come without it.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/Internal' }
        '503':
          description: |
            `rail_unavailable` or `idempotency_unavailable`.

            `rail_unavailable` on this route always means **nobody was prompted**. Before the
            charge row is written (collections switched off, the limiter or the block check
            unavailable) the `reference` stays free. After the row, when the rail refused before
            dispatching anything, the charge is left `failed` and the `reference` is closed (the
            message says "retry with a new reference"). `GET /v1/charges?reference=…` tells the
            two apart. An outcome that cannot be determined is `409 idempotency_key_acted`,
            never a 503.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    get:
      operationId: listCharges
      tags: [Charges]
      summary: List this merchant's charges
      description: |
        Cursor-paged, newest first, scoped to the authenticated merchant by the query itself —
        there is no request shape that returns another merchant's charges.

        Pass `next_cursor` from the previous page back as `cursor`, unchanged. A `next_cursor` of
        `null` means there is no further page. The cursor is an opaque `(created_at, id)` pair,
        deliberately not a page number: charges arrive while you page, and an offset would show
        you the same row twice.
      parameters:
        - name: reference
          in: query
          required: false
          description: Exact match on your own reference.
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: A charge status. Anything else is `400 invalid_request`.
          schema: { $ref: '#/components/schemas/ChargeStatus' }
        - name: created_after
          in: query
          required: false
          description: RFC 3339 timestamp, e.g. `2026-10-25T00:00:00Z`.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          description: 1 to 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: '`next_cursor` from the previous page, unchanged.'
          schema: { type: string }
      responses:
        '200':
          description: A page of charges.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChargeList' }
        '400':
          description: '`invalid_request` — bad `status`, `created_after`, `limit` or `cursor`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '404':
          description: '`merchant_not_registered`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/charges/{id}:
    get:
      operationId: getCharge
      tags: [Charges]
      summary: Read one of this merchant's charges
      description: |
        A charge belonging to another merchant, a charge that does not exist and a malformed id
        all answer `404 charge_not_found` with the same sentence.
      parameters:
        - name: id
          in: path
          required: true
          description: The charge id returned at creation.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The charge.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Charge' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '404':
          description: '`charge_not_found` (missing, malformed or another merchant''s) or `merchant_not_registered`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/transfers:
    post:
      operationId: createTransfer
      tags: [Transfers]
      summary: Send KSHS gaslessly from the signing wallet
      description: |
        Relays a transfer that **you** signed. Kakitu holds no key and never decides who pays
        whom: you send a signed intent and Kakitu pays the gas to put it on chain.

        The body is the signed transfer. `from` must be the authenticated address. The two
        signatures are the EIP-2612 permit (`v`, `r`, `s`, spender = the forwarder) and the
        EIP-712 relay intent `Relay(owner,to,value,deadline,nonce)` (`iv`, `ir`, `is`), which
        binds the recipient.

        The merchant must be **approved**. There is a per-merchant hourly cap on relayed
        transfers, because Kakitu pays the gas out of one balance; exceeding it is
        `429 rate_limited`. This cap fails closed — if it cannot be evaluated, transfers are
        refused.

        **`Idempotency-Key` is REQUIRED.** Whether a failed attempt frees the key depends on
        whether anything could have been broadcast; read the `409 idempotency_key_acted` text
        carefully before retrying.

        There is no `GET` and no `DELETE` for a transfer: there is nothing to read back or cancel.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '200':
          description: Delivered and confirmed on chain (`status` is `confirmed`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '202':
          description: |
            Submitted but not yet confirmed within the wait (`status` is `pending`). The `id` is
            the transaction hash; do not resubmit.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400':
          description: |
            `invalid_request` — a malformed or unusable signed transfer, a `from` that is not the
            authenticated address, a transfer the chain says would revert (nothing was sent), or
            a permit that another transfer from the same wallet has made out of date (nothing was
            delivered; sign fresh and use a NEW key), or a body over 4 KiB. Also `amount_below_minimum`,
            `amount_above_maximum`, `idempotency_key_required` and `idempotency_key_invalid`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '403':
          description: '`merchant_not_approved`, `merchant_suspended` (also used when the wallet itself is frozen), or `account_blocked` (a wallet on the transfer is blocked, or the money is on hold). Nothing was sent.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: '`merchant_not_registered`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: |
            `idempotency_key_reuse`, `idempotency_key_in_progress`, or `idempotency_key_acted` —
            the last is also the answer whenever the money may already have moved: when the
            relay reports this signed transfer has most likely already been delivered, AND
            when the transfer could not be completed and its outcome is not known to us. In
            both cases the key is held. Do not send it again, with this key or a new one,
            until you have checked whether it went through.

            This is the code to branch on. A `503` on this route always means nothing was
            sent; a `409 idempotency_key_acted` always means check first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: |
            `request_too_large` — the body is larger than 1 MiB. A body over **4 KiB** (and up
            to 1 MiB) is refused earlier with `400 invalid_request`: the signed transfer is read
            with a 4 KiB limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: |
            `rate_limited` (the merchant's hourly transfer cap, or the shared per-minute limit)
            or `daily_cap_exceeded` (this wallet's daily transfer limit). `Retry-After` is sent
            only with the per-minute limit; the hourly and daily caps may come without it.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/Internal' }
        '503':
          description: |
            `rail_unavailable` — transfers are temporarily unavailable and **nothing was
            sent**. This is the one failure on this route where retrying with the *same*
            `Idempotency-Key` is correct: the key was never spent.

            Also `idempotency_unavailable`.

            An outcome we cannot determine is deliberately **not** this code — it answers
            `409 idempotency_key_acted`, so that the single machine-readable field tells
            "safe to retry" and "the money may already have moved" apart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/payouts/quote:
    post:
      operationId: createPayoutQuote
      tags: [Payouts]
      summary: Price a payout and get back exactly what to sign
      description: |
        Prices a payout to a beneficiary's M-Pesa number, till, paybill or bank account (see `PayoutBeneficiary`) and mints the **single-use quote that is the
        only thing `POST /v1/payouts` will accept**. Nothing is created and no money moves.

        **Payouts are off by default for each merchant.** Two switches must both be on: the
        platform's (on today) and the merchant's own (off until an operator turns it on). Both
        are an operator's decision; until both are on this route answers `403 payouts_disabled`, and
        which of the two is off is not revealed. The merchant must also be **approved**.

        **No `Idempotency-Key`.** A quote creates nothing, and each call is a request for a
        distinct price.

        ### The two amounts are not the same number

        - `amount_kes` is what **lands on the beneficiary**. It is the number you asked for.
        - `send_kes` is what **leaves your wallet** — `amount_kes` plus `fee_kes`.
        - `value_wei` is `send_kes` in the token's smallest unit, and is the number the permit
          must be for. Do not re-derive it.

        ### The beneficiary is yours, not ours

        `beneficiary.name` is **your** text and is what the recipient sees on their M-Pesa
        statement. It is never filled in from the sending merchant's profile. At most 100
        bytes, and it must not be empty. Which other fields go with it depends on
        `beneficiary.type`: a phone is `2547xxxxxxxx`, a till is `till`, a paybill is `paybill`
        and `account`, and a bank is `account` and `bank_code`.

        ### Above the hold threshold, ask first

        A payout above `hold_above_kes` must name `payout_id`: the request a person approved at
        `POST /v1/payouts/requests`. Without it, `409 payout_approval_required`.

        ### What to sign

        `eip712` carries **both** domains, because they are different: the token's for the
        EIP-2612 permit, and the forwarder's for the EIP-712 relay intent. Signing the permit
        under the forwarder's domain produces a signature the chain rejects with nothing to
        read, so neither is left to be inferred.

        `deadline` is the **latest** deadline that will be accepted. An earlier one is fine; a
        later one is a signature the confirm refuses after you have already signed it.

        ### The daily budget is read here, not spent here

        The per-merchant daily payout cap and the per-payout maximum are checked at quote time
        so you learn you are over them **before** signing. Nothing is counted until
        `POST /v1/payouts` accepts the payout, so an abandoned quote costs you no budget.

        Unknown fields are refused outright (`400 invalid_request`). Body limit 4 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutQuoteRequest' }
      responses:
        '200':
          description: The price, and everything to sign.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutQuote' }
        '400':
          description: |
            `invalid_request` (unknown field, `amount_kes` below 1, missing `beneficiary`, a
            beneficiary that is not exactly one valid destination, a missing or over-long
            `beneficiary.name`),
            `payout_amount_above_maximum` (above the largest single payout allowed for this
            merchant — no amount of waiting makes it acceptable, only a smaller one),
            `amount_below_minimum` or `amount_above_maximum` (GET /v1/limits shows the current
            band).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '403':
          description: |
            `merchant_not_approved` or `merchant_suspended` (checked first), then
            `payouts_disabled` (payouts are not switched on for this merchant — each merchant's
            own switch is off until an operator turns it on), `account_blocked` (Kakitu has
            blocked the wallet, or money in it is on hold), `identity_verification_required`, `payout_destination_locked` (the
            merchant is locked to its saved destinations and this is not one that can be paid
            now) or `bank_unavailable` (a paybill or bank that is not a saved destination past
            its cooling-off).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: '`merchant_not_registered`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: |
            `profile_required` — this wallet has no profile (phone number and name), which the
            cash-out partner needs. There is no `/v1` route for it: save one with the wallet's
            own `POST /profile` (same signature headers; body
            `{"phone": "2547XXXXXXXX", "first_name": "…", "last_name": "…"}`) or in the Kakitu
            app.

            Also `payout_approval_required` (above `hold_above_kes` with no `payout_id`),
            `payout_not_approved` (that `payout_id` is undecided, rejected, lapsed or used) and
            `payout_approval_mismatch` (the amount or beneficiary is not what was approved).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: '`request_too_large` — the body is larger than 4 KiB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: |
            `rate_limited`, or `payout_daily_cap_exceeded` — this merchant's daily **payout**
            budget is spent; it resets at midnight East Africa Time. This is deliberately not
            `daily_cap_exceeded`, which is the separate **collection** cap: raising that one
            would change nothing here. `Retry-After` is sent only with the shared per-minute
            `rate_limited`.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/Internal' }
        '503':
          description: |
            `rail_unavailable` — payouts are temporarily unavailable and **nothing was priced**.
            Try again shortly. The payout limiter fails closed: if it cannot count, no payout is
            priced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/payouts:
    post:
      operationId: createPayout
      tags: [Payouts]
      summary: Confirm a signed payout
      description: |
        Spends a quote from `POST /v1/payouts/quote` and accepts the payout. The body is the
        quote id plus that quote, signed.

        **`Idempotency-Key` is REQUIRED.** Unlike the quote route, this one authorises money
        leaving.

        ### The quote is single-use and bound to you

        A quote id can be confirmed **once**. A quote that has already been spent, has expired,
        belongs to another merchant, or was minted somewhere other than
        `POST /v1/payouts/quote` — a `/v1/quotes` price or an older `/ramp/*` quote id, neither
        of which is a payout quote — all answer `404 payout_quote_not_found` with the same
        sentence. There is no way to tell them apart, and there is no way to tell any of them
        from an id that never existed.

        ### The signature must match the quote exactly

        - `transfer.from` must be your own authenticated address.
        - `transfer.to` must be the quote's `treasury_address`.
        - `transfer.value_wei` must be the quote's `value_wei`, byte for byte.
        - `transfer.deadline` must be in the future and **no later than** the quote's
          `deadline`. Earlier is your own business.

        Anything else is `400 invalid_request` and nothing is sent — **but the quote and the
        day's budget are already spent.** This route accepts the quote id (spending it, and
        counting the amount against the daily payout cap) **before** it compares the signed
        transfer with it. A mismatched signature therefore costs the quote and that much
        budget; get a new quote and sign exactly what it says.

        ### 202 means accepted, not paid

        This route answers **202**: the payout is `dispatched` and the money is on its way. Poll
        `GET /v1/payouts/{id}`, or wait for `payout.paid` or `payout.failed`.

        A payout **above** the merchant's `hold_above_kes` must have been approved first
        (`POST /v1/payouts/requests`); without that it is `409 payout_approval_required`. A
        payout whose outcome is not known stays `dispatched`, and `payout.failed` is never
        raised for it.

        ### The daily budget is spent here

        The per-merchant daily payout cap is counted at this moment, once — before the signed
        transfer is checked — and there is no refund path: a payout that is accepted and then fails has still spent the budget. Retry
        a failed payout by creating a **new** one, never by expecting this row to move again.

        Unknown fields are refused outright (`400 invalid_request`). Body limit 4 KiB.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutConfirmRequest' }
      responses:
        '202':
          description: |
            Accepted. `status` is `dispatched` (on its way). Nothing has reached the beneficiary
            yet; branch on `status`, not on the HTTP code.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '400':
          description: |
            `invalid_request` (unknown field, missing `quote_id` or `transfer`, or a signed
            transfer that does not match the quote — nothing was sent),
            `payout_amount_above_maximum`, `amount_below_minimum`, `amount_above_maximum`,
            `idempotency_key_required` or `idempotency_key_invalid`. A signed transfer that does
            not match the quote has still spent the quote and the day's budget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '403':
          description: |
            `merchant_not_approved` or `merchant_suspended` (checked first), then
            `payouts_disabled`, `account_blocked` (nothing was sent), or
            `identity_verification_required`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: |
            `payout_quote_not_found` — the quote does not exist, has expired, has already been
            confirmed, or is not a payout quote. Ask for a new one at
            `POST /v1/payouts/quote`. Also `merchant_not_registered`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: |
            `profile_required` (no profile yet: save one with `POST /profile`, see
            `POST /v1/payouts/quote`), or one of the idempotency conflicts:
            `idempotency_key_reuse`, `idempotency_key_in_progress`, `idempotency_key_acted`.

            `idempotency_key_acted` is also the answer when the payout was handed over and its
            outcome is **not known to us**. The money may already have moved and the key is
            held. Do **not** send it again, with this key or a new one, until you have checked
            `GET /v1/payouts/{id}`.

            This is the code to branch on. On this route a `503` always means nothing was sent;
            a `409 idempotency_key_acted` always means check first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: '`request_too_large` — the body is larger than 4 KiB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: |
            `rate_limited`, or `payout_daily_cap_exceeded` — the daily **payout** budget, not
            the collection cap. It resets at midnight East Africa Time. `Retry-After` is sent
            only with the shared per-minute `rate_limited`.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/Internal' }
        '503':
          description: |
            `rail_unavailable` — **nothing was sent**, and the quote is spent. Ask for a new
            quote and retry shortly. Also `idempotency_unavailable`, where nothing ran at all
            and retrying with the same key is correct.

            An outcome we cannot determine is deliberately **not** this code — it answers
            `409 idempotency_key_acted`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    get:
      operationId: listPayouts
      tags: [Payouts]
      summary: List the signing wallet's payouts
      description: |
        Cursor-paged, newest first. It exists so that losing a payout id is not the same as
        losing sight of the money: `POST /v1/payouts` hands back an id, and before this route
        that id was the only handle on it.

        The pagination is `GET /v1/charges`'s, deliberately and exactly: the same opaque
        `(created_at, id)` cursor, the same 1 to 100 `limit` defaulting to 20, the same
        `data` / `next_cursor` body. Pass `next_cursor` back as `cursor`, unchanged; `null`
        means there is no further page. A cursor this API did not issue is
        `400 invalid_request`, never a silently different page.

        There is **no `reference` filter**. A payout carries no merchant-supplied reference —
        that is a charge field.

        **This route does not require merchant registration.** It is scoped by the signing
        address alone, in the repository's `WHERE` clause, so a wallet that never registered
        gets an empty page rather than `404 merchant_not_registered`. That is where it differs
        from `GET /v1/charges`, which does answer `merchant_not_registered`.

        Each element is the same object `GET /v1/payouts/{id}` returns, `message` included.
      parameters:
        - name: status
          in: query
          required: false
          description: A payout status. Anything else is `400 invalid_request`, not an empty page.
          schema: { $ref: '#/components/schemas/PayoutStatus' }
        - name: created_after
          in: query
          required: false
          description: RFC 3339 timestamp, e.g. `2026-10-25T00:00:00Z`. Exclusive.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          description: 1 to 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: '`next_cursor` from the previous page, unchanged.'
          schema: { type: string }
      responses:
        '200':
          description: |
            A page of payouts. A caller with none — including one that is not a registered
            merchant — gets `{"data": [], "next_cursor": null}`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutList' }
        '400':
          description: '`invalid_request` — bad `status`, `created_after`, `limit` or `cursor`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/RailUnavailable' }
  /v1/payouts/{id}:
    get:
      operationId: getPayout
      tags: [Payouts]
      summary: Read one of this merchant's payouts
      description: |
        A payout belonging to another merchant, a payout that does not exist and a malformed id
        all answer `404 payout_not_found` with the same sentence. There is no way to tell them
        apart.

        This is the poll for a request: `pending_approval` becomes `approved` (with
        `approval_expires_at`) or `rejected`, and an approval nobody signed becomes `expired`.
        A `dispatched` payout becomes `paid` or `failed`; one whose outcome is not known stays
        `dispatched`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The payout.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '404':
          description: '`payout_not_found` — missing, malformed id, or another merchant''s. All the same answer.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/RailUnavailable' }
  /v1/payouts/requests:
    post:
      operationId: requestPayout
      tags: [Payouts]
      summary: Ask a person to approve a payout before anything is signed
      description: |
        A payout **above** the merchant's `hold_above_kes` (see `GET /v1/limits`) is decided by
        a person before it is signed. This route asks. **Nothing is priced, signed or counted
        against the day's budget**, so a request can wait as long as a person takes: the answer
        is `202` with `status: "pending_approval"`.

        The decision arrives as a webhook, `payout.approved` (with `approval_expires_at`) or
        `payout.rejected`, and as the payout's `status` on `GET /v1/payouts/{id}`. After
        `payout.approved`, call `POST /v1/payouts/quote` with the `payout_id` and the **same**
        `amount_kes` and `beneficiary`, sign, and `POST /v1/payouts` before `approval_expires_at`.

        **`payout.rejected` means do not ask again.** `payout.expired` after an approval means
        the merchant did not sign in time: make a new request.

        A merchant may have only so many requests waiting at once (20 by default); past that,
        `429 payout_open_requests_exceeded`. An amount that does not need approval is
        `400 invalid_request`: quote it and sign that.

        **`Idempotency-Key` is REQUIRED.** Payouts are off by default (`403 payouts_disabled`).
        Body limit 4 KiB; unknown fields are refused.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutRequestBody' }
      responses:
        '202':
          description: Asked. `status` is `pending_approval`; `fee_kes` and `send_kes` are `0` until a quote prices it.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '400':
          description: |
            `invalid_request` (unknown field, a beneficiary that is not exactly one valid
            destination, an amount that does not need approval), `payout_amount_above_maximum`,
            `idempotency_key_required` or `idempotency_key_invalid`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '403':
          description: '`merchant_not_approved`, `merchant_suspended`, `payouts_disabled`, `payout_destination_locked` or `bank_unavailable`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: '`merchant_not_registered`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: '`idempotency_key_reuse` or `idempotency_key_in_progress`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: '`request_too_large` — the body is larger than 4 KiB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: '`payout_open_requests_exceeded` (a decision or a lapsed approval frees a place) or `rate_limited`.'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/RailUnavailable' }
  /v1/payout-destinations:
    get:
      operationId: listPayoutDestinations
      tags: [Payout destinations]
      summary: List saved destinations, and whether the lock binds
      description: |
        Any registered merchant may read its own list, suspended or not. `payout_locked` says
        whether the merchant is held to this list now, and `payout_unlocks_at` is present only
        while an unlock is pending.

        **The lock controls where cash-outs can go. It does not stop KSHS transfers to other
        wallets.**
      responses:
        '200':
          description: The list.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestinationList' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '404':
          description: '`merchant_not_registered`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      operationId: savePayoutDestination
      tags: [Payout destinations]
      summary: Save a place the merchant may pay
      description: |
        Saves one place, in the beneficiary's field names and **with no name**. A bank is looked
        up and its `holder_name` stored. **A new place waits out `payout_cooling_off_hours`
        (24 by default, never less than 1) before it can be paid**: `status` is `cooling_off`
        until `active_at`. A `payout_destination.added` event and an operator alarm go out at
        once, so a place added by anybody else who holds the key is seen before it can be used.

        `201` for a new place, `200` for one already saved (its clock untouched, so a retry
        costs nothing). A merchant may keep up to 50 places. **No `Idempotency-Key`.** Needs an
        approved merchant. Body limit 4 KiB; unknown fields are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavePayoutDestinationRequest' }
      responses:
        '200':
          description: Already saved. The first row, untouched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestination' }
        '201':
          description: Saved. It can be paid from `active_at`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestination' }
        '400':
          description: '`invalid_request` (not exactly one valid destination) or `unknown_bank`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '403':
          description: '`merchant_not_approved`, `merchant_suspended` or `bank_unavailable`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: '`merchant_not_registered`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: '`payout_destinations_full` — remove one first.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: '`account_not_found` — the bank does not hold that account.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/RailUnavailable' }
  /v1/payout-destinations/{id}:
    delete:
      operationId: removePayoutDestination
      tags: [Payout destinations]
      summary: Remove a saved destination, at once
      description: |
        Immediate: removing narrows where money can go, so it never waits. Any registered
        merchant may, suspended or not. A payout already approved to this place can no longer be
        signed, and one already dispatched is out of reach. A `payout_destination.removed` event
        is raised.

        Another merchant's place, a missing one and an id that is no UUID are one answer,
        `404 payout_destination_not_found`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [id, removed]
                properties:
                  id: { type: string, format: uuid }
                  removed: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '404':
          description: '`payout_destination_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/payout-destinations/lock:
    post:
      operationId: setPayoutLock
      tags: [Payout destinations]
      summary: Lock the merchant to its saved destinations, or ask to unlock
      description: |
        `{"locked": true}` binds **at once** and cancels an unlock in progress.
        `{"locked": false}` leaves the lock on until `payout_unlocks_at`, which is
        `payout_cooling_off_hours` later. Either raises `payout_lock.changed` and an alarm.

        **A locked merchant can pay only a saved destination whose `active_at` has passed.**
        Anything else is `403 payout_destination_locked`. The lock holds on the payout routes
        and on the wallet's own cash-out routes (`/ramp/withdraw/quote` is held to the same
        list; a cash-out to USDC on Base is refused outright).

        **The lock controls where cash-outs can go. It does not stop KSHS transfers to other
        wallets**, so it is not protection against somebody who holds the key moving KSHS on
        chain.

        Locking needs only a registered merchant (a suspended owner must still be able to cancel
        an unlock somebody asked for); unlocking needs an approved one. **No `Idempotency-Key`.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutLockRequest' }
      responses:
        '200':
          description: The lock, after this change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutLock' }
        '400':
          description: '`invalid_request` — the body must be exactly `{"locked": true}` or `{"locked": false}`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '403':
          description: '`merchant_not_approved` or `merchant_suspended` (unlocking only).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: '`merchant_not_registered`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/balances:
    get:
      operationId: getBalances
      tags: [Reads]
      summary: Read the signing wallet's on-chain balances
      description: |
        Reads the caller's own KSHS and USDC balances from the chain. An address with no history
        holds zero; that is an answer, not an error.

        `kshs.amount_kes` is whole shillings, **rounded down**: a balance of 99.99 KSHS reads
        `99`. A chain read that fails answers `500 internal`, not `503`; retry shortly.

        Both balances state their `network`. KSHS v2 is an ERC-20 on Base — a customer has
        already lost money sending a token to a Kakitu address on the wrong chain, so the chain
        is never something you have to infer.
      responses:
        '200':
          description: The balances.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balances' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/RailUnavailable' }
  /v1/orders/{id}:
    get:
      operationId: getOrder
      tags: [Reads]
      summary: Read one of the signing wallet's deposit or withdrawal orders
      description: |
        An order that belongs to another wallet, one that does not exist, one with a malformed id
        and one this API does not expose (a merchant collection, a card load) all answer
        `404 order_not_found` with the same sentence.

        `status` is a small closed set. An internal pipeline step that has no public meaning
        collapses to `processing`, never the raw internal word.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The order.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '404':
          description: '`order_not_found`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/RailUnavailable' }
  /v1/limits:
    get:
      operationId: getLimits
      tags: [Reads]
      summary: Read the current withdrawal band, and your own payout limits
      description: |
        The published band is **cached**, refreshed on a timer (about every five minutes), so
        after the payout route is switched it can describe the previous route for up to that
        long. `max_staleness_seconds` says how stale it can be and the response says so in
        `note` rather than pretending to be live.

        A quote, not this band, is what decides whether an amount is accepted.

        `source` is `live` when the numbers came from the payout route, `estimated` when they are
        the configured fallback because the route has not answered.

        A **registered merchant** also gets a `payout` object: the per-payout maximum, the daily
        payout cap, the hold threshold and what is left of today's budget. For any other caller
        the `payout` key is **absent entirely** — this is a wallet route as well as a merchant
        one, and the withdrawal band is never withheld over a merchant-only extra.
      responses:
        '200':
          description: The band, and the caller's `payout` limits if it is a registered merchant.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Limits' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/RailUnavailable' }
  /v1/quotes:
    post:
      operationId: createQuote
      tags: [Reads]
      summary: Price a deposit or a withdrawal
      description: |
        A price, and only a price. **No order, charge or transfer is created**, which is why this
        `POST` takes **no `Idempotency-Key`** — sending one is harmless but pointless.

        - `type: "deposit"` — shillings in, KSHS out. `pay_kes` is what the payer is asked for.
          `phone` is the payer's number.
        - `type: "withdrawal"` — KSHS in, shillings out. `send_kes` is the KSHS that would be
          sent. `beneficiary` is **required**.

        The response carries no quote id, no rail, no treasury address and no signing amount.
        There is deliberately no `quote_id`: the pricing partner's own id is not yours to hold,
        and there is no route today that would redeem one.

        Unknown fields are refused outright (`400 invalid_request`). Body limit 4 KiB.

        **30 quotes a minute per address**, on top of the shared per-minute limit, enforced
        even when the shared limiter's store is down. Over it: `429 rate_limited` with
        `Retry-After`. It is not reflected in the `RateLimit-*` headers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: The price.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400':
          description: |
            `invalid_request` (unknown field, bad `type`, `amount_kes` below 1, missing
            `beneficiary` on a withdrawal, or an amount/phone/beneficiary not valid for this
            wallet), `amount_below_minimum` or `amount_above_maximum` — GET /v1/limits shows the
            current band — or, on a withdrawal, `insufficient_balance`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '403':
          description: '`identity_verification_required` — this amount needs the customer''s identity verified first; or `account_blocked` — Kakitu has blocked this wallet.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: |
            `profile_required` — this wallet has no profile (phone number and name), which the
            cash-out partner needs. There is no `/v1` route for it: save one with the wallet's
            own `POST /profile` (same signature headers; body
            `{"phone": "2547XXXXXXXX", "first_name": "…", "last_name": "…"}`) or in the Kakitu
            app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: '`request_too_large` — the body is larger than 4 KiB.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/RailUnavailable' }
  /v1/events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: List this merchant's webhook events
      description: |
        Webhook delivery is **at-least-once and best effort, not guaranteed**. An endpoint that
        was down for a day has events marked `abandoned`. This endpoint plus
        `POST /v1/events/{id}/replay` is the whole recovery story: see what we tried to send, fix
        your side, ask for it again — no support ticket needed.

        `payload` is the signed body verbatim, as a JSON value rather than a quoted string.
        `last_error` is from a closed vocabulary (`http_503`, `timeout`, `no_callback_url`, …),
        never a raw Go error string.

        ### An event is about a charge **or** about a payout

        At most one of `charge_id` and `payout_id` is set; the other is `null`, and on
        `transfer.received` and the three payout-control events both are. `charge_id` was once
        always present and is now **nullable**. A typed client generated from an older version
        of this document breaks on the first payout event it receives.

        Branch on `type`, and only on `type`:

        | `type` | What it means | What to do |
        | --- | --- | --- |
        | `charge.paid` | the rail says the payer paid | — |
        | `charge.settled` | your wallet is credited on chain | — |
        | `charge.failed` | the collection failed | — |
        | `transfer.received` | KSHS arrived at your address; carries the payer's `reference`, which is a claim and not proof | check amount and recipient |
        | `payout.approved` | a person said yes to a request | quote with `payout_id` and **sign now**, before `approval_expires_at` |
        | `payout.rejected` | a person said no | **do not** ask again |
        | `payout.expired` | the payout was **not sent**; an approval went unsigned, or a signature lapsed | ask again with a **new** payout |
        | `payout.cancelled` | the payout was **not sent**; a person refused it | **do not** submit it again |
        | `payout.paid` | the beneficiary has the money | — |
        | `payout.failed` | it did not reach the beneficiary | a retry is a **new** payout |
        | `payout_destination.added` | somebody saved a new place to pay | if it was not you, remove it |
        | `payout_destination.removed` | a saved place came off the list | — |
        | `payout_lock.changed` | the payout lock moved | if it was not you, turn it on again |

        `payout.expired`, `payout.cancelled` and `payout.rejected` all mean no money left your
        wallet, which is exactly why they are separate types and not one: one of them asks you
        to try again and the others forbid it.

        Scoped to the authenticated merchant by the query itself. Same opaque cursor as the
        charge list.
      parameters:
        - name: type
          in: query
          required: false
          description: |
            A typo here is refused rather than quietly matching nothing. All thirteen types are
            filterable — `?type=payout.expired` is the filter a merchant most needs, because that
            is the event saying money did **not** go and must be asked for again.

            There is no `payout_id` filter — narrow with `type` and read `payout_id` off the
            rows.
          schema: { $ref: '#/components/schemas/EventType' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EventStatus' }
        - name: charge_id
          in: query
          required: false
          description: Restrict to events for one of your charges.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: '`next_cursor` from the previous page, unchanged.'
          schema: { type: string }
      responses:
        '200':
          description: A page of events.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventList' }
        '400':
          description: '`invalid_request` — bad `type`, `status`, `charge_id`, `limit` or `cursor`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '404':
          description: '`merchant_not_registered`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/events/{id}/replay:
    post:
      operationId: replayEvent
      tags: [Events]
      summary: Put a webhook event back in the delivery queue
      description: |
        Requeues the event with a fresh 24-hour delivery budget, whatever state it was in —
        `abandoned` after a day of failures, or `delivered` and simply lost on your side.

        **No `Idempotency-Key`**: replay is idempotent by construction, since requeuing an
        already-requeued event sets the same row to the same state.

        Answers **202**, not 200: nothing has been delivered when this returns. The worker picks
        the row up on its next tick, and the body is the queued state, not a delivery receipt.

        The event id does **not** change on a replay. That is the point: a receiver that dedupes
        on the event id, as the at-least-once contract requires, can tell this is an event it may
        already have seen.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Requeued. The body is the event in its queued state.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/AuthFailure' }
        '404':
          description: |
            `event_not_found` (missing, malformed id, or another merchant's — all the same
            answer) or `merchant_not_registered`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
webhooks:
  charge.paid:
    post:
      operationId: onChargePaid
      tags: [Events]
      summary: charge.paid — the payer paid
      description: |
        POSTed to your merchant's `callback_url`. The rail says the payer paid; the KSHS is
        **not** at your address yet, so wait for `charge.settled` before releasing goods.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChargePaidPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  charge.settled:
    post:
      operationId: onChargeSettled
      tags: [Events]
      summary: charge.settled — the KSHS is at your address
      description: |
        POSTed to your merchant's `callback_url`. The merchant's wallet is credited on chain.
        This is the event to release goods on.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChargeSettledPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  charge.failed:
    post:
      operationId: onChargeFailed
      tags: [Events]
      summary: charge.failed — the collection did not go through
      description: |
        POSTed to your merchant's `callback_url`. The collection failed, or a payment that had
        gone through was refunded. `charge.paid_at` is what tells the two apart: `null` for a
        charge that never reached paid, a timestamp for one that was paid and then refunded.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChargeFailedPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  payout.expired:
    post:
      operationId: onPayoutExpired
      tags: [Events]
      summary: payout.expired — NOT sent, sign and submit it again
      description: |
        POSTed to your merchant's `callback_url`. **The money did not go.** An approval went
        unsigned past `approval_expires_at`, or a held payout's signed permit lapsed. Nothing
        left your wallet and nothing reached the beneficiary. The answer is a **new** payout:
        a fresh request, quote and signature.

        This is the exact opposite instruction to `payout.cancelled`, which carries the same
        amounts and the same "nothing was sent". Branch on `type` and on nothing else.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutExpiredPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  payout.cancelled:
    post:
      operationId: onPayoutCancelled
      tags: [Events]
      summary: payout.cancelled — NOT sent, do NOT submit it again
      description: |
        POSTed to your merchant's `callback_url`. **The money did not go, and it must not be
        sent again.** A person looked at the held payout and refused it; re-signing walks
        straight back into a decision that was just taken.

        There is no reason field and no sentence to read, deliberately: a receiver that had to
        parse English to decide whether to send money a second time would eventually get it
        wrong.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutCancelledPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  transfer.received:
    post:
      operationId: onTransferReceived
      tags: [Events]
      summary: transfer.received — KSHS arrived at your address
      description: |
        POSTed to your merchant's `callback_url`. A transfer to your address, from anybody, by
        any route. `transfer.reference` is the payer's claim and not proof: check the amount and
        the recipient before you release goods.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferReceivedPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  payout.approved:
    post:
      operationId: onPayoutApproved
      tags: [Events]
      summary: payout.approved — a person said yes, sign now
      description: |
        POSTed to your merchant's `callback_url`. Quote with the `payout_id`, sign, and submit
        before `payout.approval_expires_at`.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutApprovedPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  payout.rejected:
    post:
      operationId: onPayoutRejected
      tags: [Events]
      summary: payout.rejected — a person said no, do NOT ask again
      description: |
        POSTed to your merchant's `callback_url`. Nothing was signed or sent.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutRejectedPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  payout.paid:
    post:
      operationId: onPayoutPaid
      tags: [Events]
      summary: payout.paid — the beneficiary has the money
      description: |
        POSTed to your merchant's `callback_url`.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutPaidPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  payout.failed:
    post:
      operationId: onPayoutFailed
      tags: [Events]
      summary: payout.failed — it did not reach the beneficiary
      description: |
        POSTed to your merchant's `callback_url`. A retry is a new payout.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutFailedPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  payout_destination.added:
    post:
      operationId: onPayoutDestinationAdded
      tags: [Events]
      summary: payout_destination.added — a new place to pay was saved
      description: |
        POSTed to your merchant's `callback_url`. If you did not save it, somebody else holds
        your key: remove it before `destination.active_at`, and replace the key.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutDestinationEventPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  payout_destination.removed:
    post:
      operationId: onPayoutDestinationRemoved
      tags: [Events]
      summary: payout_destination.removed — a saved place came off your list
      description: |
        POSTed to your merchant's `callback_url`. While locked, somebody holding your key can stop
        your payouts this way, so it is announced like an addition.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutDestinationEventPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
  payout_lock.changed:
    post:
      operationId: onPayoutLockChanged
      tags: [Events]
      summary: payout_lock.changed — the payout lock moved
      description: |
        POSTed to your merchant's `callback_url`. If somebody asked for the lock to come off and
        it was not you, turn it on again: that cancels the unlock at once.
      parameters:
        - $ref: '#/components/parameters/KakituSignature'
        - $ref: '#/components/parameters/KakituEventId'
        - $ref: '#/components/parameters/KakituEventType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutLockChangedPayload' }
      responses:
        '200': { $ref: '#/components/responses/WebhookAccepted' }
        '4XX': { $ref: '#/components/responses/WebhookRejected' }
components:
  securitySchemes:
    walletSignature:
      type: apiKey
      in: header
      name: X-Kakitu-Signature
      description: |
        Wallet-signature authentication. There are no API keys. OpenAPI can only name one header
        here; **all three are required on every request**:

        - `X-Kakitu-Address` — the signing wallet address.
        - `X-Kakitu-Timestamp` — unix seconds, within **120 s** of server time.
        - `X-Kakitu-Signature` — `0x` + 65 bytes, EIP-191 `personal_sign` over
          `{METHOD} {path}{?query} {timestamp} {sha256hex(body)}`.

        A given (address, method, path+query, timestamp, body hash) is accepted once; a repeat
        within the **300 s** replay window is rejected. See the Authentication section of the
        description for the full scheme.
  headers:
    XRequestId:
      description: The id for this request, minted by the server. Quote it to support. An `X-Request-Id` you send is ignored.
      schema: { type: string, format: uuid }
    RateLimitLimit:
      description: Requests allowed from this address in the current one-minute window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests remaining in the current window. Never below 0.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the current window rolls over.
      schema: { type: integer }
    RetryAfter:
      description: |
        Seconds to wait before retrying. Sent with the shared per-minute `rate_limited` (same
        value as `RateLimit-Reset`), the quote limit and the per-IP `too_many_requests`. **May
        be absent** on the other 429s listed with it; do not assume it is there.
      required: false
      schema: { type: integer }
    XRateLimitLimit:
      description: The per-IP limiter's allowance per minute. Present on every response.
      schema: { type: integer }
    XRateLimitRemaining:
      description: Requests left from this IP in the current window.
      schema: { type: integer }
    XRateLimitReset:
      description: Unix time, in seconds, when the per-IP window resets.
      schema: { type: integer }
    IdempotentReplayed:
      description: Present and `true` when this is the stored response of an earlier request with the same `Idempotency-Key`.
      schema: { type: string, const: 'true' }
  parameters:
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A unique string you generate per logical request; a UUID is ideal. At most 255
        characters. Resend the SAME key when retrying so the request is never executed twice;
        use a NEW key for a new request. Missing: `400 idempotency_key_required`.
      schema: { type: string, minLength: 1, maxLength: 255 }
    KakituSignature:
      name: Kakitu-Signature
      in: header
      required: true
      description: |
        `t=<unix seconds>,v1=<hex HMAC-SHA256>`, where `v1` is the HMAC-SHA256 — keyed with your
        webhook secret — of the string `<t>.<raw body>`.

        **This is the only header worth trusting.** The other two are a convenience and both
        values are also inside the signed body; a receiver that reads them without verifying the
        signature has verified nothing.

        The timestamp is *inside* the signed string, which is what makes checking it worth
        anything: move `t` and the signature breaks. Verify against the **exact bytes** of the
        request body — parsing and re-serialising reorders keys and changes whitespace, and you
        would then be checking a different string from the one we signed.
      schema: { type: string }
    KakituEventId:
      name: Kakitu-Event-Id
      in: header
      required: true
      description: |
        The event id, and your dedupe key. It is stable across every retry and every replay, and
        is the same value as `id` in the body. Delivery is **at-least-once**: key on this, ignore
        an id you have already processed, and you get exactly-once. Do not key on the charge or
        payout id — one subject produces several events.
      schema: { type: string, format: uuid }
    KakituEventType:
      name: Kakitu-Event-Type
      in: header
      required: true
      description: The event type, the same value as `type` in the body.
      schema: { $ref: '#/components/schemas/EventType' }
  responses:
    WebhookAccepted:
      description: |
        Any 2xx, and nothing else, counts as delivered, **within 10 seconds**: an attempt that
        has not answered by then is a `timeout` failure and is retried. Answer as soon as you
        have stored the event and do your work afterwards — a receiver that processes before answering turns a
        slow job into a retry. The response body is read to a bound and discarded.
    WebhookRejected:
      description: |
        Anything that is not 2xx is a failed delivery and is retried: 30s, 1m, 2m, 4m, doubling
        to a 6h ceiling, until the next attempt would fall outside 24 hours from the first — at
        which point the event is marked `abandoned`, stays readable on `GET /v1/events` and can
        be replayed with `POST /v1/events/{id}/replay`.

        A **3xx is also a failure** and the redirect is not followed: following one would carry
        a body signed for your host to a host the signature was never meant for.
    AuthFailure:
      description: |
        Unauthorized. Two shapes are possible on 401: the signature middleware answers
        `AuthError`, while a handler that finds no authenticated address answers the standard
        `ErrorEnvelope` with code `unauthorized`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AuthError'
              - $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: |
        `rate_limited` — too many requests from this address in the current minute (the
        envelope). Or, from the per-IP limiter in front of every route, `too_many_requests` in
        the older shape `{"error": "too_many_requests"}`. Branch on whether `error` is a string
        or an object.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - $ref: '#/components/schemas/TooManyRequests'
    PerIPRateLimited:
      description: '`too_many_requests` from the per-IP limiter, in the older body shape.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/XRateLimitReset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TooManyRequests' }
    Internal:
      description: '`internal` — something went wrong on our side. The message is always the same sentence; quote `request_id` to support.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RailUnavailable:
      description: '`rail_unavailable` — temporarily unavailable (the partner, cash-out capacity, or the wallet check), try again shortly. Nothing was created or sent.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    MerchantRequest:
      type: object
      additionalProperties: false
      required: [business_name, contact_email]
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            1 to 100 characters. No control, invisible or text-direction characters. It is the
            name an operator vets. It is not sent with the M-Pesa prompt on a collection today.
            Frozen once the merchant is past `pending`.
        contact_email:
          type: string
          maxLength: 254
          description: A plain email address. `Bob <a@b.co>` is refused.
        contact_phone:
          type: [string, 'null']
          maxLength: 20
          description: |
            Digits, `+`, spaces and hyphens only. Absent or `null` leaves the stored value
            unchanged; `""` clears it.
        callback_url:
          type: [string, 'null']
          maxLength: 512
          description: |
            Where webhooks are delivered. Must be `https`, port 443 only, no credentials in the
            URL, a public host (no loopback, private, link-local, CGNAT or reserved address, no
            single-label or `.local`/`.internal`/`.localhost`/`.lan`/`.home.arpa` name), ASCII
            only — supply a non-ASCII domain in punycode. At most 512 characters. Absent or
            `null` leaves the stored value unchanged; `""` clears it.
        state:
          description: Accepted and ignored. Set by a Kakitu operator.
        webhook_secret:
          description: Accepted and ignored. Set by a Kakitu operator; never readable over the API.
        daily_cap_kes:
          description: Accepted and ignored. Set by a Kakitu operator.
        per_charge_max_kes:
          description: Accepted and ignored. Set by a Kakitu operator.
        address:
          description: Accepted and ignored. The address always comes from the signature.
        reviewed_by:
          description: Accepted and ignored. Set by a Kakitu operator.
        review_note:
          description: Accepted and ignored. Set by a Kakitu operator.
    Merchant:
      type: object
      required: [address, business_name, contact_email, contact_phone, callback_url, state, daily_cap_kes, per_charge_max_kes]
      properties:
        address:
          type: string
          description: The merchant's wallet address — the credential and the settlement destination.
        business_name: { type: string }
        contact_email: { type: string }
        contact_phone: { type: string, description: Empty string when none is stored. }
        callback_url: { type: string, description: Empty string when none is stored. }
        state:
          type: string
          enum: [pending, approved, rejected, suspended]
          description: |
            `pending` on registration. Only an `approved` merchant may create charges or
            transfers. Changed by a Kakitu operator, never by this API.
        daily_cap_kes: { type: integer, format: int64 }
        per_charge_max_kes: { type: integer, format: int64 }
    ChargeStatus:
      type: string
      description: |
        Kakitu's own vocabulary, never the payment rail's. `pending` created, nothing sent yet;
        `prompted` the payer's handset has been rung; `paid` the rail says the payer paid;
        `settled` the merchant's wallet is credited on chain (with the KSHS minted for the
        payment, which is less than `amount`). `settled` and `cancelled` are
        terminal; `failed` and `expired` are not, because a late completion can still arrive.
      enum: [pending, prompted, paid, settled, failed, expired, cancelled]
    ChargeRequest:
      type: object
      required: [amount, phone, reference]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: A positive whole number of KES. Not a decimal.
        phone:
          type: string
          description: The payer's Kenyan mobile number. It is hashed; it is never returned.
        reference:
          type: string
          minLength: 1
          maxLength: 128
          description: Your own reference. Must be unique per merchant, or `409 reference_reused`.
        id:
          description: Accepted and ignored, so a charge object can be round-tripped.
        status:
          description: Accepted and ignored. A client must not choose its own status.
        currency:
          description: Accepted and ignored.
        created_at:
          description: Accepted and ignored.
        paid_at:
          description: Accepted and ignored.
        settled_at:
          description: Accepted and ignored.
        fee_kes:
          description: Accepted and ignored.
        credited_kes:
          description: Accepted and ignored.
    Charge:
      type: object
      required: [id, reference, amount, currency, status, created_at, paid_at, settled_at, fee_kes, credited_kes]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        amount: { type: integer, format: int64, description: Whole KES. }
        currency: { type: string, const: KES }
        status: { $ref: '#/components/schemas/ChargeStatus' }
        created_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        settled_at: { type: [string, 'null'], format: date-time }
        fee_kes: { type: [integer, 'null'], format: int64, description: 'What the collection cost, in whole KES. `null` until the charge is paid, and cleared again if a paid charge is refunded.' }
        credited_kes: { type: [integer, 'null'], format: int64, description: 'What reached the merchant''s wallet, in whole KES: `amount` less `fee_kes`. `null` until the charge is paid.' }
    ChargeList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Charge' }
        next_cursor:
          type: [string, 'null']
          description: Pass back as `cursor` for the next page. `null` on the last page.
    TransferRequest:
      type: object
      required: [from, to, value_wei, deadline, v, r, s, iv, ir, is]
      properties:
        from: { type: string, description: Must equal the authenticated address. }
        to: { type: string, description: The recipient address. }
        value_wei: { type: string, description: 'Amount in the token''s smallest unit, as a decimal string.' }
        deadline: { type: integer, format: int64, description: Unix seconds; the permit's expiry. }
        v: { type: integer, description: 'EIP-2612 permit signature (spender = the forwarder).' }
        r: { type: string, description: 'EIP-2612 permit signature.' }
        s: { type: string, description: 'EIP-2612 permit signature.' }
        iv: { type: integer, description: 'EIP-712 Relay(owner,to,value,deadline,nonce) intent signature, which binds the recipient.' }
        ir: { type: string, description: 'EIP-712 relay intent signature.' }
        is: { type: string, description: 'EIP-712 relay intent signature.' }
        reference:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]{1,64}$'
          description: |
            Your note on the payment, such as an order number. **Not signed**, so it can be
            added after signing. The payee reads it on `GET /transfers` and in the
            `transfer.received` webhook. **It is the payer's claim, not proof**: the payee still
            checks the amount and the recipient. Omit it when there is none; anything outside
            the pattern is `400 invalid_request` and nothing is sent.
    Transfer:
      type: object
      required: [id, status]
      properties:
        id: { type: string, description: The transaction hash — your only handle on this transfer. }
        status:
          type: string
          enum: [pending, confirmed]
          description: '`confirmed` with HTTP 200; `pending` with HTTP 202.'
    PayoutBeneficiary:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        Where a payout goes and who is being paid. `type` says which kind of place it is, and
        each type takes **exactly** its own fields; a field of another type, or a field with no
        `type` to go with it, is `400 invalid_request`. A body with a `phone` and no `type` means
        phone, and a phone payout is answered with no `type`, exactly as before types existed.

        | `type` | Fields |
        | --- | --- |
        | `phone` (or none) | `phone` |
        | `till` | `till` |
        | `paybill` | `paybill`, `account` |
        | `bank` | `account`, `bank_code` |

        A paybill or a bank is open only once it is a saved destination past its cooling-off.
        A bank is paid under the name the bank gave when it was saved, whatever `name` says.
      properties:
        type:
          type: string
          enum: [phone, till, paybill, bank]
          description: Omitted means `phone`, and is omitted on a phone payout's answers.
        phone:
          type: string
          description: |
            **Phone.** A Kenyan mobile number: `254`, then `7` or `1`, then eight digits. No `+`,
            no leading `0`.
          pattern: '^254[17]\d{8}$'
        till:
          type: string
          description: '**Till.** A Buy Goods till number, 5 to 9 digits.'
          pattern: '^\d{5,9}$'
        paybill:
          type: string
          description: '**Paybill.** A paybill number, 5 to 9 digits.'
          pattern: '^\d{5,9}$'
        account:
          type: string
          description: |
            **Paybill:** the account to credit, 1 to 40 letters, digits, spaces, dots,
            underscores or dashes. **Bank:** the bank account number.
        bank_code:
          type: string
          description: '**Bank.** From the bank list. An unknown one is `unknown_bank`.'
        name:
          type: string
          minLength: 1
          description: |
            **Your** name for the person being paid, and what their M-Pesa statement shows. It
            is never derived from the sending merchant's own profile. Required for every type,
            at most 100 **bytes** of UTF-8 after trimming — a non-ASCII letter counts two or
            more, so fewer than 100 such characters fit.
    PayoutQuoteRequest:
      type: object
      additionalProperties: false
      required: [amount_kes, beneficiary]
      properties:
        payout_id:
          type: string
          format: uuid
          description: |
            The id of a request a person has approved (`POST /v1/payouts/requests`). Required
            for a payout above the merchant's `hold_above_kes`; `amount_kes` and `beneficiary`
            must then be what was approved, or `409 payout_approval_mismatch`.
        amount_kes:
          type: integer
          format: int64
          minimum: 1
          description: |
            A whole number of shillings, at least 1. This is what **lands on the beneficiary**,
            not what leaves your wallet — see `send_kes` on the response.
        beneficiary: { $ref: '#/components/schemas/PayoutBeneficiary' }
    PayoutRequestBody:
      type: object
      additionalProperties: false
      required: [amount_kes, beneficiary]
      description: Ask a person to approve a payout before anything is signed. The same two fields a quote takes.
      properties:
        amount_kes:
          type: integer
          format: int64
          minimum: 1
          description: Whole KES that will land on the beneficiary.
        beneficiary: { $ref: '#/components/schemas/PayoutBeneficiary' }
    EIP712Domain:
      type: object
      required: [name, version, chain_id, verifying_contract]
      description: One EIP-712 domain. Sign under the right one; the chain gives no reason when you do not.
      properties:
        name: { type: string }
        version: { type: string }
        chain_id: { type: integer, format: int64 }
        verifying_contract: { type: string }
    PayoutQuote:
      type: object
      required: [quote_id, amount_kes, fee_kes, send_kes, currency, beneficiary, expires_at, value_wei, treasury_address, deadline, eip712]
      description: |
        A priced payout plus everything to sign. It carries no rail name, no rail quote id and
        no order id: `quote_id` is Kakitu's own and is redeemable only at `POST /v1/payouts`.
      properties:
        payout_id:
          type: string
          format: uuid
          description: 'Present only when this quote spends an approved request: the payout your signature will land on.'
        quote_id:
          type: string
          description: |
            Single-use and bound to your merchant address. Prefixed `pq_`. A quote id from
            `POST /v1/quotes` or from an older `/ramp/*` route is not one of these and is
            refused exactly as an id that never existed.
        amount_kes: { type: integer, format: int64, description: Whole KES that lands on the beneficiary. }
        fee_kes: { type: integer, format: int64, description: 'Kakitu''s fee, in whole KES.' }
        send_kes:
          type: integer
          format: int64
          description: Whole KES leaving your wallet — `amount_kes` + `fee_kes`.
        currency: { type: string, const: KES }
        beneficiary: { $ref: '#/components/schemas/PayoutBeneficiary' }
        expires_at:
          type: string
          format: date-time
          description: When the price stops being redeemable. After this the quote answers `payout_quote_not_found`.
        value_wei:
          type: string
          description: |
            `send_kes` in the token's smallest unit, as a decimal string. This is the number the
            permit must be for, and `transfer.value_wei` must equal it exactly.
        treasury_address:
          type: string
          description: Where the KSHS goes. `transfer.to` must be this address.
        deadline:
          type: integer
          format: int64
          description: |
            Unix seconds: the **latest** permit deadline that will be accepted. Sign this or
            anything earlier that is still in the future; a later one is refused after you have
            signed.
        eip712:
          type: object
          required: [permit, relay]
          description: Both domains, because they are different and neither is guessable.
          properties:
            permit:
              allOf: [{ $ref: '#/components/schemas/EIP712Domain' }]
              description: The token's domain, for the EIP-2612 permit (`v`, `r`, `s`).
            relay:
              allOf: [{ $ref: '#/components/schemas/EIP712Domain' }]
              description: The forwarder's domain, for the EIP-712 relay intent (`iv`, `ir`, `is`).
    PayoutDestination:
      type: object
      required: [id, type, status, active_at, created_at]
      description: A saved payout destination. A locked merchant can pay only an `active` one.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [phone, till, paybill, bank] }
        phone: { type: string }
        till: { type: string }
        paybill: { type: string }
        account: { type: string, description: 'A paybill''s account, or a bank account number.' }
        bank_code: { type: string }
        holder_name: { type: string, description: 'On a bank: the name the bank gave at the save.' }
        status:
          type: string
          enum: [cooling_off, active]
          description: '`cooling_off` until `active_at`, then `active`.'
        active_at: { type: string, format: date-time, description: The moment it can first be paid. }
        created_at: { type: string, format: date-time }
    PayoutLock:
      type: object
      required: [payout_locked]
      properties:
        payout_locked: { type: boolean, description: Whether the merchant is held to its saved destinations now. }
        payout_unlocks_at:
          type: string
          format: date-time
          description: Present only while an unlock is pending; the lock is still on until then.
    PayoutDestinationList:
      allOf:
        - $ref: '#/components/schemas/PayoutLock'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/PayoutDestination' }
    SavePayoutDestinationRequest:
      type: object
      additionalProperties: false
      description: |
        One place, in the beneficiary's field names and with **no name**: phone (or no type)
        needs `phone`, till needs `till`, paybill needs `paybill` and `account`, bank needs
        `account` and `bank_code`.
      properties:
        type: { type: string, enum: [phone, till, paybill, bank] }
        phone: { type: string }
        till: { type: string }
        paybill: { type: string }
        account: { type: string }
        bank_code: { type: string }
    PayoutLockRequest:
      type: object
      additionalProperties: false
      required: [locked]
      properties:
        locked: { type: boolean }
    PayoutConfirmRequest:
      type: object
      additionalProperties: false
      required: [quote_id, transfer]
      properties:
        quote_id:
          type: string
          description: The `quote_id` from `POST /v1/payouts/quote`. Redeemable once.
        transfer:
          allOf: [{ $ref: '#/components/schemas/TransferRequest' }]
          description: |
            That quote, signed. `from` must be your own address, `to` must be the quote's
            `treasury_address`, `value_wei` must be the quote's exactly, and `deadline` must be
            in the future and no later than the quote's. Anything else is `400 invalid_request`
            and nothing is sent.
    PayoutStatus:
      type: string
      description: |
        Kakitu's own vocabulary, never a payment partner's.

        - `quoted` — priced, nothing signed, nothing moved.
        - `pending_approval` — you asked a person (above `hold_above_kes`). Nothing is signed,
          priced or counted. Wait for `payout.approved` or `payout.rejected`.
        - `approved` — a person said yes. Quote with `payout_id`, sign and submit before
          `approval_expires_at`.
        - `rejected` — terminal. A person said no. Nothing was sent. Do not ask again.
        - `held` — signed and accepted, not yet handed over. A payout at or below the threshold
          passes through this for an instant.
        - `dispatched` — handed over; the money is leaving. `payout.paid` or `payout.failed`
          follows. A payout whose outcome is not known stays `dispatched`.
        - `paid` — terminal. The beneficiary has the money.
        - `failed` — terminal. Retry by creating a **new** payout; this one never moves again.
        - `cancelled` — terminal. A person refused a held payout. Nothing was sent. Do not
          submit it again. Kept for payouts already written; a refusal now ends `rejected`.
        - `expired` — terminal. Nothing was sent and nothing can be: an approval went unsigned
          past `approval_expires_at`, or a quote lapsed. Ask again with a new payout.

        All five of `paid`, `failed`, `cancelled`, `rejected` and `expired` are final — unlike a
        charge, where `failed` and `expired` can still move.
      enum: [quoted, pending_approval, approved, rejected, held, dispatched, paid, failed, cancelled, expired]
    Payout:
      type: object
      required: [id, status, amount_kes, fee_kes, send_kes, currency, beneficiary, created_at]
      description: |
        A payout as a developer sees it. No order id, no rail name, no provider status and no
        pricing partner's quote id — none of that is part of the contract.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        amount_kes: { type: integer, format: int64, description: Whole KES landing on the beneficiary. }
        fee_kes: { type: integer, format: int64 }
        send_kes: { type: integer, format: int64, description: Whole KES leaving your wallet. }
        currency: { type: string, const: KES }
        beneficiary: { $ref: '#/components/schemas/PayoutBeneficiary' }
        created_at: { type: string, format: date-time }
        approval_expires_at:
          type: string
          format: date-time
          description: Present on an `approved` payout only. Sign and submit before this, or ask again.
        message:
          type: string
          description: |
            Kakitu's own sentence about what is happening now. Present on `pending_approval`,
            `approved`, `rejected`, `held` and `dispatched`. Omitted otherwise. For humans —
            never branch on it; branch on `status`.
    PayoutList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Payout' }
        next_cursor:
          type: [string, 'null']
          description: Pass back as `cursor` for the next page. `null` on the last page.
    Balances:
      type: object
      required: [kshs, usdc]
      properties:
        kshs:
          type: object
          required: [amount_kes, network]
          properties:
            amount_kes: { type: integer, format: int64, description: 'Whole shillings, rounded down. A fraction of a shilling is not shown.' }
            network: { type: string, description: 'The chain the balance is on, e.g. `base`.' }
        usdc:
          type: object
          required: [amount, network]
          properties:
            amount: { type: string, description: 'A decimal string, e.g. "3.5". Not a JSON number.' }
            network: { type: string, description: 'The chain the balance is on, e.g. `base`.' }
    Order:
      type: object
      required: [id, type, status, amount_kes, receive_kes, fee_kes, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [deposit, withdrawal]
        status:
          type: string
          enum: [awaiting_payment, processing, completed, failed, refunding, refunded]
          description: '`processing` covers every internal step with no public meaning.'
        amount_kes:
          type: integer
          format: int64
          description: 'Deposit: shillings paid in. Withdrawal: KSHS sent.'
        receive_kes:
          type: integer
          format: int64
          description: 'Deposit: KSHS received. Withdrawal: shillings paid out.'
        fee_kes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Present only while the order is `awaiting_payment`.
    Limits:
      type: object
      required: [withdrawal, max_staleness_seconds, note]
      properties:
        withdrawal:
          type: object
          required: [min_kes, max_kes, source]
          properties:
            min_kes: { type: integer, format: int64 }
            max_kes: { type: integer, format: int64 }
            source:
              type: string
              enum: [live, estimated]
              description: '`live` read from the payout route; `estimated` the configured fallback.'
        payout:
          $ref: '#/components/schemas/PayoutLimits'
        max_staleness_seconds:
          type: integer
          description: The longest this band can be behind the payout route.
        note: { type: string, description: A human-readable staleness caveat. }
    PayoutLimits:
      type: object
      required: [enabled, max_kes, daily_cap_kes, hold_above_kes, remaining_today_kes, note]
      description: |
        The caller's own payout governance, published so that an integrator does not have to
        discover it by being refused.

        **The whole object is absent — not `null`, not an empty object — for a caller that is
        not a registered merchant.** `GET /v1/limits` is a wallet route too, and an ordinary
        customer has no payout limits to be told about. Test for the key, not for its contents.
      properties:
        enabled:
          type: boolean
          description: |
            ONE fact: the platform-wide payout switch **and** this merchant's own, ANDed. It
            deliberately does not say which of the two is off, because the `payouts_disabled`
            refusal does not either. The three numbers below are published either way, so a
            `false` here still tells you what the limits would be.
        max_kes:
          type: integer
          format: int64
          description: |
            The largest single payout. Exact: read from the same place the enforcement reads
            it, so it cannot disagree with `payout_amount_above_maximum`.
        daily_cap_kes:
          type: integer
          format: int64
          description: |
            The day's payout budget. Exact, same source as the enforcement. The day resets at
            midnight **East Africa Time**, not UTC.
        hold_above_kes:
          type: integer
          format: int64
          description: |
            A payout **above** this needs a person's approval before it can be signed: ask at
            `POST /v1/payouts/requests` — a normal step, not an error. "Above" is strict: a
            payout exactly equal to this goes straight through. A threshold of 0 sends everything
            to a person.
        remaining_today_kes:
          type: [integer, 'null']
          format: int64
          description: |
            What is left of `daily_cap_kes`, floored at zero. A **snapshot, not an
            authorisation**: another payout of your own can land between this read and your
            next request, so it may already be lower. It is `null` when the counter could not
            be read, and **`null` never means zero** — a budget that cannot be read is not an
            empty one. The quote, not this field, is what authorises an amount.
        note:
          type: string
          description: The same caveats in a sentence, for a human reading the body.
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [type, amount_kes]
      properties:
        type:
          type: string
          enum: [deposit, withdrawal]
        amount_kes:
          type: integer
          format: int64
          minimum: 1
          description: A whole number of shillings, at least 1.
        phone:
          type: string
          description: The payer's number. Used for a deposit quote.
        beneficiary:
          type: [object, 'null']
          description: Required for a withdrawal quote.
          additionalProperties: false
          properties:
            channel:
              type: string
              enum: [mobile_money, buy_goods, paybill]
              description: >-
                `mobile_money` pays an M-Pesa number, `buy_goods` a till, `paybill` a paybill
                (which also needs `reference`). Any other value, `mpesa` included, is
                `400 invalid_request`. `paybill` withdrawals are closed for every wallet at the
                moment and are refused (today as `500 internal`).
            number:
              type: string
              description: The mobile number, or a till or paybill number of 5 to 9 digits.
            reference:
              type: string
              description: The account reference. Required for `paybill`.
    Quote:
      type: object
      required: [type, receive_kes, fee_kes, rate_kes_per_usdc, expires_at]
      properties:
        type:
          type: string
          enum: [deposit, withdrawal]
        pay_kes:
          type: integer
          format: int64
          description: Deposit only — what the payer is asked for. Omitted on a withdrawal.
        send_kes:
          type: integer
          format: int64
          description: Withdrawal only — the KSHS that would be sent. Omitted on a deposit.
        receive_kes: { type: integer, format: int64 }
        fee_kes: { type: integer, format: int64 }
        rate_kes_per_usdc: { type: string, description: 'A decimal string, not a JSON number.' }
        expires_at: { type: string, format: date-time }
    EventType:
      type: string
      description: |
        The whole published set, as it appears on an event and as the `type` query filter on
        `GET /v1/events` accepts it. `payout.expired` means the payout was never sent and you
        should ask again with a new payout; `payout.cancelled` and `payout.rejected` mean a
        person refused it and you must not.

        `type` also decides the shape of `payload`; see `EventPayload`.
      enum:
        - charge.paid
        - charge.settled
        - charge.failed
        - transfer.received
        - payout.approved
        - payout.rejected
        - payout.expired
        - payout.cancelled
        - payout.paid
        - payout.failed
        - payout_destination.added
        - payout_destination.removed
        - payout_lock.changed
    EventStatus:
      type: string
      description: |
        `pending` not yet delivered; `delivered` your endpoint answered 2xx; `abandoned` attempts
        exhausted — kept for the audit trail and for replay.
      enum: [pending, delivered, abandoned]
    ChargePaidPayload:
      title: charge.paid
      type: object
      required: [id, type, created_at, charge]
      description: |
        The rail says the payer paid. The merchant's wallet is **not** credited yet; that is
        `charge.settled`. There is no `payout` key on a charge event — absent, not null.
      properties:
        id:
          type: string
          format: uuid
          description: The event id, and the dedupe key. The same value as the `Kakitu-Event-Id` header, and the same on every retry and every replay.
        type: { type: string, const: charge.paid }
        created_at:
          type: string
          format: date-time
          description: When the event was raised, not when it was delivered. RFC 3339, UTC, to the second.
        charge:
          type: object
          required: [id, reference, amount, currency, status, paid_at, settled_at, fee_kes, credited_kes]
          properties:
            id: { type: string, format: uuid }
            reference: { type: string, minLength: 1, description: 'The merchant''s own reference, unique per merchant. Never empty.' }
            amount: { type: integer, format: int64, description: 'Whole KES. The key is `amount`, not `amount_kes`; a payout payload names its amounts differently.' }
            currency: { type: string, const: KES }
            status: { type: string, const: paid }
            paid_at: { type: string, format: date-time, description: 'Always a timestamp on this type, never null.' }
            settled_at: { type: 'null', description: 'Always null on this type. The key is present; nothing has settled yet.' }
            fee_kes: { type: integer, format: int64, description: 'What the collection cost, in whole KES.' }
            credited_kes: { type: integer, format: int64, description: 'What reaches the merchant''s wallet: `amount` less `fee_kes`.' }
    ChargeSettledPayload:
      title: charge.settled
      type: object
      required: [id, type, created_at, charge]
      description: |
        The merchant's wallet is credited on chain. This is the event to release goods on.
      properties:
        id: { type: string, format: uuid, description: 'The event id, and the dedupe key.' }
        type: { type: string, const: charge.settled }
        created_at: { type: string, format: date-time, description: 'RFC 3339, UTC, to the second.' }
        charge:
          type: object
          required: [id, reference, amount, currency, status, paid_at, settled_at, fee_kes, credited_kes]
          properties:
            id: { type: string, format: uuid }
            reference: { type: string, minLength: 1, description: 'The merchant''s own reference. Never empty.' }
            amount: { type: integer, format: int64, description: 'Whole KES.' }
            currency: { type: string, const: KES }
            status: { type: string, const: settled }
            paid_at:
              type: string
              format: date-time
              description: |
                Always a timestamp on this type, never null. For a charge that reached settled
                without a `charge.paid` ever being raised, it is the moment it settled.
            settled_at: { type: string, format: date-time, description: 'Always a timestamp on this type, never null. Equals `created_at`.' }
            fee_kes: { type: integer, format: int64, description: 'What the collection cost, in whole KES.' }
            credited_kes: { type: integer, format: int64, description: 'What reached the merchant''s wallet: `amount` less `fee_kes`.' }
    ChargeFailedPayload:
      title: charge.failed
      type: object
      required: [id, type, created_at, charge]
      description: |
        The collection did not go through, or a payment that had gone through was refunded.

        There is **no reason, code or message** on this type. Why a collection failed is a
        rail's word about a payer and is not part of the contract. `paid_at` is what tells a
        refund from a payment that never arrived.
      properties:
        id: { type: string, format: uuid, description: 'The event id, and the dedupe key.' }
        type: { type: string, const: charge.failed }
        created_at: { type: string, format: date-time, description: 'RFC 3339, UTC, to the second.' }
        charge:
          type: object
          required: [id, reference, amount, currency, status, paid_at, settled_at, fee_kes, credited_kes]
          properties:
            id: { type: string, format: uuid }
            reference: { type: string, minLength: 1, description: 'The merchant''s own reference. Never empty.' }
            amount: { type: integer, format: int64, description: 'Whole KES — what was asked for, not what was collected.' }
            currency: { type: string, const: KES }
            status: { type: string, const: failed }
            paid_at:
              type: [string, 'null']
              format: date-time
              description: |
                `null` for a charge that never reached paid — the ordinary case. A timestamp for
                one that was paid and then refunded, and it is when it was **paid**, not when it
                failed.
            settled_at: { type: 'null', description: 'Always null on this type. A settled charge never fails.' }
            fee_kes: { type: 'null', description: 'Always null on this type. Nothing was credited.' }
            credited_kes: { type: 'null', description: 'Always null on this type. Nothing was credited.' }
    PayoutExpiredPayload:
      title: payout.expired
      type: object
      required: [id, type, created_at, payout]
      description: |
        **The payout was NOT sent. Ask again with a new payout.**

        Either an approval went unsigned past `approval_expires_at`, or a held payout's signed
        permit passed its deadline. Nothing left the merchant's wallet and nothing reached the
        beneficiary. There is no `charge` key on a payout event — absent, not null.
      properties:
        id: { type: string, format: uuid, description: 'The event id, and the dedupe key.' }
        type: { type: string, const: payout.expired }
        created_at: { type: string, format: date-time, description: 'When the hold ended. The only timestamp on a payout payload.' }
        payout: { allOf: [{ $ref: '#/components/schemas/PayoutEventSubject' }] }
    PayoutCancelledPayload:
      title: payout.cancelled
      type: object
      required: [id, type, created_at, payout]
      description: |
        **The payout was NOT sent. A person refused it. DO NOT submit it again.**

        Nothing left the merchant's wallet and nothing reached the beneficiary — exactly as with
        `payout.expired`, which is precisely why the two are separate types. There is no
        cancellation reason and there will not be one: deciding whether to send money a second
        time must never depend on parsing a sentence.
      properties:
        id: { type: string, format: uuid, description: 'The event id, and the dedupe key.' }
        type: { type: string, const: payout.cancelled }
        created_at: { type: string, format: date-time, description: 'When the hold ended. The only timestamp on a payout payload.' }
        payout: { allOf: [{ $ref: '#/components/schemas/PayoutEventSubject' }] }
    PayoutEventSubject:
      type: object
      required: [id, status, amount_kes, fee_kes, send_kes, currency]
      description: |
        The payout a `payout.*` event is about. Every field is always present and never null,
        except `approval_expires_at`, which is on `payout.approved` only.

        It carries no beneficiary number, account or name (those are on `GET /v1/payouts/{id}` under
        `beneficiary`, never on the wire to a callback URL), no operator identity, no hold
        reason, no rail name, no pricing partner's quote id and no signed permit. It carries no
        `held_at`, `dispatched_at` or `paid_at` either, because none of them would be true.
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [approved, rejected, expired, cancelled, paid, failed]
          description: Always restates `type`, minus the `payout.` prefix.
        amount_kes: { type: integer, format: int64, description: 'Whole KES that would have landed on the beneficiary.' }
        fee_kes: { type: integer, format: int64, description: 'Kakitu''s fee. May be 0.' }
        send_kes: { type: integer, format: int64, description: 'Whole KES that would have left the merchant''s wallet. `0` on `payout.approved`: a request is priced when it is signed.' }
        currency: { type: string, const: KES }
        approval_expires_at:
          type: string
          format: date-time
          description: On `payout.approved` only. Sign and submit before this.
    TransferReceivedPayload:
      title: transfer.received
      type: object
      required: [id, type, created_at, transfer]
      description: |
        **KSHS arrived at the merchant's address on chain**, from anybody, by any route. Mints
        and burns are never announced. Only an approved merchant receives it.

        `transfer.reference` is **the payer's claim, not proof**: anybody can pay an address
        with any reference. Check the amount and the recipient against the order it names.
      properties:
        id: { type: string, format: uuid, description: 'The event id, and the dedupe key.' }
        type: { type: string, const: transfer.received }
        created_at: { type: string, format: date-time }
        transfer:
          type: object
          required: [tx_hash, log_index, from, to, amount_kes, value_wei, block_number, observed_at]
          properties:
            tx_hash: { type: string }
            log_index: { type: integer, description: 'Which `Transfer` log in the transaction. With `tx_hash` it names the payment.' }
            from: { type: string, description: The payer's address. }
            to: { type: string, description: The merchant's address. }
            amount_kes: { type: string, description: 'The exact amount as a decimal STRING, such as `"99.5"`, not whole shillings.' }
            value_wei: { type: string, description: 'The same amount in the token''s smallest unit, as a string.' }
            block_number: { type: integer, format: int64 }
            observed_at: { type: string, format: date-time }
            reference:
              type: string
              pattern: '^[A-Za-z0-9._:-]{1,64}$'
              description: Present only when the payer sent one. The key is absent otherwise.
    PayoutApprovedPayload:
      title: payout.approved
      type: object
      required: [id, type, created_at, payout]
      description: '**A person said yes. Quote and sign it now**, before `payout.approval_expires_at`.'
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: payout.approved }
        created_at: { type: string, format: date-time }
        payout: { allOf: [{ $ref: '#/components/schemas/PayoutEventSubject' }] }
    PayoutRejectedPayload:
      title: payout.rejected
      type: object
      required: [id, type, created_at, payout]
      description: |
        **A person said no. Do not ask again.** Nothing was signed, sent or counted against the
        budget. It can also follow `payout.approved`, if an operator takes the yes back before
        the merchant has signed.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: payout.rejected }
        created_at: { type: string, format: date-time }
        payout: { allOf: [{ $ref: '#/components/schemas/PayoutEventSubject' }] }
    PayoutPaidPayload:
      title: payout.paid
      type: object
      required: [id, type, created_at, payout]
      description: '**The beneficiary has the money.**'
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: payout.paid }
        created_at: { type: string, format: date-time }
        payout: { allOf: [{ $ref: '#/components/schemas/PayoutEventSubject' }] }
    PayoutFailedPayload:
      title: payout.failed
      type: object
      required: [id, type, created_at, payout]
      description: |
        **It did not reach the beneficiary. A retry is a new payout**, and counts against the
        budget again. Never raised for an outcome nobody knows: that payout stays `dispatched`.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: payout.failed }
        created_at: { type: string, format: date-time }
        payout: { allOf: [{ $ref: '#/components/schemas/PayoutEventSubject' }] }
    PayoutDestinationEventPayload:
      title: payout_destination.added / payout_destination.removed
      type: object
      required: [id, type, created_at, destination]
      description: |
        About the merchant's own saved destinations. **If you did not make the change, somebody
        else holds your key.** A destination is named by its type and the end of its number; the
        holder's name stays out.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [payout_destination.added, payout_destination.removed] }
        created_at: { type: string, format: date-time }
        destination:
          type: object
          required: [id, type, ending]
          properties:
            id: { type: string, format: uuid, description: The id to `DELETE` it with. }
            type: { type: string, enum: [phone, till, paybill, bank] }
            ending: { type: string, description: The last four characters of the number. }
            active_at: { type: string, format: date-time, description: 'On `payout_destination.added` only: the moment it can first be paid.' }
    PayoutLockChangedPayload:
      title: payout_lock.changed
      type: object
      required: [id, type, created_at, payout_lock]
      description: |
        **The payout lock moved.** It went on, or somebody asked for it to come off. If that was
        not you, turn it on again: that cancels the unlock at once. The lock controls where
        cash-outs can go; it does not stop KSHS transfers to other wallets.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: payout_lock.changed }
        created_at: { type: string, format: date-time }
        payout_lock:
          type: object
          required: [locked]
          properties:
            locked: { type: boolean, description: 'Always `true`: asking to unlock leaves the lock on until `unlocks_at`.' }
            unlocks_at: { type: string, format: date-time, description: Only while an unlock is pending. }
    EventPayload:
      description: |
        The body of one webhook delivery, and the value of `payload` on an event. Which shape it
        is, is decided by `type` and by nothing else.

        Three things hold for all thirteen:

        - **It is never a delta.** Every body states its subject's state **at the time the event
          was raised**, in full. That is what makes a duplicate delivery a no-op rather than a
          second count — and delivery is at-least-once, so duplicates happen.
        - **Exactly one subject key is present**: `charge`, `transfer`, `payout`, `destination`
          or `payout_lock`. The others are *absent*, not null.
        - **The subject's `status` restates `type`.** It tells a receiver nothing `type` did not.

        Because retries run for up to 24 hours, a body can arrive after its subject has moved
        on. Order processing by `created_at`, not by arrival.
      oneOf:
        - $ref: '#/components/schemas/ChargePaidPayload'
        - $ref: '#/components/schemas/ChargeSettledPayload'
        - $ref: '#/components/schemas/ChargeFailedPayload'
        - $ref: '#/components/schemas/TransferReceivedPayload'
        - $ref: '#/components/schemas/PayoutApprovedPayload'
        - $ref: '#/components/schemas/PayoutRejectedPayload'
        - $ref: '#/components/schemas/PayoutExpiredPayload'
        - $ref: '#/components/schemas/PayoutCancelledPayload'
        - $ref: '#/components/schemas/PayoutPaidPayload'
        - $ref: '#/components/schemas/PayoutFailedPayload'
        - $ref: '#/components/schemas/PayoutDestinationEventPayload'
        - $ref: '#/components/schemas/PayoutLockChangedPayload'
      discriminator:
        propertyName: type
        mapping:
          charge.paid: '#/components/schemas/ChargePaidPayload'
          charge.settled: '#/components/schemas/ChargeSettledPayload'
          charge.failed: '#/components/schemas/ChargeFailedPayload'
          transfer.received: '#/components/schemas/TransferReceivedPayload'
          payout.approved: '#/components/schemas/PayoutApprovedPayload'
          payout.rejected: '#/components/schemas/PayoutRejectedPayload'
          payout.expired: '#/components/schemas/PayoutExpiredPayload'
          payout.cancelled: '#/components/schemas/PayoutCancelledPayload'
          payout.paid: '#/components/schemas/PayoutPaidPayload'
          payout.failed: '#/components/schemas/PayoutFailedPayload'
          payout_destination.added: '#/components/schemas/PayoutDestinationEventPayload'
          payout_destination.removed: '#/components/schemas/PayoutDestinationEventPayload'
          payout_lock.changed: '#/components/schemas/PayoutLockChangedPayload'
    Event:
      type: object
      required: [id, type, charge_id, payout_id, created_at, status, attempts, next_attempt_at, last_attempt_at, delivered_at, payload]
      description: |
        At most one of `charge_id` and `payout_id` is non-null. `transfer.received` and the three
        payout-control events (`payout_destination.*`, `payout_lock.changed`) have **both**
        `null`: read their subject from `payload`.
      properties:
        id:
          type: string
          format: uuid
          description: The dedupe key. It does not change on a replay.
        type: { $ref: '#/components/schemas/EventType' }
        charge_id:
          type: [string, 'null']
          format: uuid
          description: |
            The charge this event is about. **`null` on every event that is not about a charge**
            — this field used to be always present, and a client that assumes so breaks on the
            first payout event.
        payout_id:
          type: [string, 'null']
          format: uuid
          description: The payout this event is about. `null` on every event that is not about a payout.
        created_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/EventStatus' }
        attempts: { type: integer }
        next_attempt_at:
          type: [string, 'null']
          format: date-time
          description: Non-null only while `status` is `pending`.
        last_attempt_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        last_error:
          type: string
          description: |
            A closed cause vocabulary (`http_503`, `timeout`, `no_callback_url`, …), never a raw
            error string. Omitted when there is none.
        payload:
          allOf: [{ $ref: '#/components/schemas/EventPayload' }]
          description: |
            The signed webhook body verbatim — the exact bytes that were or will be POSTed to
            your callback URL — rendered as a JSON value rather than a quoted string, so it
            needs no second parse.

            Its shape is decided by `type`: a `charge.*` event carries a `charge` object, a
            `payout.*` event a `payout`, `transfer.received` a `transfer`, and so on; the other
            keys are absent rather than null. See `EventPayload`.
    EventList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        next_cursor:
          type: [string, 'null']
          description: Pass back as `cursor` for the next page. `null` on the last page.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: For a human developer. May be reworded at any time. Never branch on it.
            request_id:
              type: string
              description: Always present, never empty. The same id is in `X-Request-Id` and in our logs.
    ErrorCode:
      type: string
      description: |
        The closed error-code set. Each code has exactly one HTTP status, shown below. This is
        the contract; branch on it rather than on `message`.
      enum:
        - invalid_request
        - unauthorized
        - merchant_not_registered
        - merchant_not_approved
        - merchant_suspended
        - merchant_name_frozen
        - open_loan
        - account_blocked
        - idempotency_key_required
        - idempotency_key_invalid
        - idempotency_key_reuse
        - idempotency_key_in_progress
        - idempotency_key_acted
        - idempotency_unavailable
        - request_too_large
        - amount_below_minimum
        - amount_above_maximum
        - daily_cap_exceeded
        - payer_velocity_exceeded
        - rate_limited
        - charge_not_found
        - reference_reused
        - rail_unavailable
        - order_not_found
        - event_not_found
        - payouts_disabled
        - payout_daily_cap_exceeded
        - payout_amount_above_maximum
        - payout_not_found
        - payout_quote_not_found
        - payout_approval_required
        - payout_not_approved
        - payout_approval_mismatch
        - payout_open_requests_exceeded
        - payout_destination_locked
        - payout_destination_not_found
        - payout_destinations_full
        - profile_required
        - bank_unavailable
        - unknown_bank
        - account_not_found
        - insufficient_balance
        - identity_verification_required
        - internal
      x-http-status:
        invalid_request: 400
        unauthorized: 401
        merchant_not_registered: 404
        merchant_not_approved: 403
        merchant_suspended: 403
        merchant_name_frozen: 409
        open_loan: 409
        account_blocked: 403
        idempotency_key_required: 400
        idempotency_key_invalid: 400
        idempotency_key_reuse: 409
        idempotency_key_in_progress: 409
        idempotency_key_acted: 409
        idempotency_unavailable: 503
        request_too_large: 413
        amount_below_minimum: 400
        amount_above_maximum: 400
        daily_cap_exceeded: 429
        payer_velocity_exceeded: 429
        rate_limited: 429
        charge_not_found: 404
        reference_reused: 409
        rail_unavailable: 503
        order_not_found: 404
        event_not_found: 404
        payouts_disabled: 403
        payout_daily_cap_exceeded: 429
        payout_amount_above_maximum: 400
        payout_not_found: 404
        payout_quote_not_found: 404
        payout_approval_required: 409
        payout_not_approved: 409
        payout_approval_mismatch: 409
        payout_open_requests_exceeded: 429
        payout_destination_locked: 403
        payout_destination_not_found: 404
        payout_destinations_full: 409
        profile_required: 409
        bank_unavailable: 403
        unknown_bank: 400
        account_not_found: 422
        insufficient_balance: 400
        identity_verification_required: 403
        internal: 500
    TooManyRequests:
      type: object
      description: |
        The per-IP limiter's 429 body. It is NOT the standard error envelope: `error` is a
        string, and there is no `request_id` or `message`.
      required: [error]
      properties:
        error: { type: string, const: too_many_requests }
    PublicConfig:
      type: object
      description: |
        Public chain configuration and live limits and prices. Every value can change without
        a release; read it rather than hard-coding it. Fields not listed may be added.
      properties:
        chain_id: { type: integer, description: 'Base mainnet, `8453`.' }
        kshs_contract: { type: string, description: The KSHS ERC-20 contract on Base. Verify payments against its `Transfer` logs. }
        forwarder: { type: string, description: The gasless-transfer forwarder. }
        usdc_contract: { type: string }
        treasury_address: { type: string }
        public_rpc_url: { type: string }
        relay_max_per_tx_kes: { type: integer, description: 'Largest single KSHS transfer Kakitu relays, in whole shillings.' }
        deposit_max_per_order_usd: { type: integer, description: 'Largest single M-Pesa purchase of KSHS, in US dollars. Also the ceiling on one M-Pesa collection (`POST /v1/charges`).' }
        deposit_min_per_order_usd: { type: integer }
        withdraw_max_per_order_kes: { type: integer, description: 'Largest single cash-out to M-Pesa, in shillings that land. Live from the cash-out partner.' }
        withdraw_min_per_order_kes: { type: integer, description: Smallest single cash-out to M-Pesa. `0` means not known. }
        directory_bucket_hex: { type: integer }
        directory_max_buckets: { type: integer }
        min_supported_build: { type: integer }
        latest_build: { type: integer }
        store_url_android: { type: string }
        store_url_ios: { type: string, description: Empty while there is no listing. }
        mint_rate_kes_per_usdc: { type: string, description: 'A decimal string, e.g. "131". Not a JSON number.' }
        mint_spread_bps: { type: integer }
        agent_fee_bps: { type: integer }
        agent_fee_cap_kshs: { type: integer }
        agency_mode: { type: string }
        platform_fee_bps: { type: integer, description: "Kakitu's share of an agent's counter fee. Not charged on wallet-to-wallet payments." }
        platform_fee_cap_kshs: { type: integer }
        agent_min_float_usdc: { type: integer }
        order_expiry_minutes: { type: integer }
        cashout_capacity_kes:
          type: [integer, 'null']
          description: |
            The largest KSHS amount one M-Pesa cash-out may **send** right now that the hot
            treasury can back (before the fee, unlike the `withdraw_*` band, which is in
            shillings that land). A cash-out over it is refused at the quote, before anything
            moves. `null` when it is not known; `0` is a real answer. Moves all day.
    AuthError:
      type: object
      description: |
        The 401 shape of the signature middleware. It is NOT the standard error envelope and
        carries no `request_id`; read `X-Request-Id` from the response headers instead.
      required: [error, reason]
      properties:
        error: { type: string, const: unauthorized }
        reason:
          type: string
          enum:
            - missing_auth_headers
            - bad_timestamp
            - timestamp_out_of_range
            - unreadable_body
            - bad_signature
            - auth_unavailable
            - replay
